name: signal-incident
services:
  app:
    build:
      context: .
      target: runtime
    init: true
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in your environment or .env file}
      HOST: 0.0.0.0
      PORT: 4330
      DATABASE_PATH: /app/data/application.sqlite
      TICK_MS: ${TICK_MS:-1000}
    ports:
      - "127.0.0.1:${PORT:-4330}:4330"
    volumes:
      - application-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s
volumes:
  application-data:
